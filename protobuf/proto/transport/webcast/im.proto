syntax = "proto3";
package transport.webcast.im;

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msg_id = 3;
  int32 msg_type = 4;
  int64 offset = 5;
  bool need_wrds_store = 6;
  int64 wrds_version = 7;
  string wrds_sub_key = 8;
  map<string,string> message_extra = 9;
  string tenant_id = 10;
}

message PayloadInIm {
  map<string,bytes> Payloads = 1;
  int32 CompressType = 2;

  enum CompressTypeEnum {
    NONE = 0;
    ZLIB = 1;
    ZSTD = 2;
  }
}

message PreviewHistoryResponse {
  ResponseData data = 1;

  message ResponseData {
    repeated Message messages = 1;
  }
}

message PushFrame {
  uint64 SeqID = 1;
  uint64 LogID = 2;
  int32 service = 3;
  int32 method = 4;
  repeated PushHeader headers = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
  string LodIDNew = 9;
}

message PushHeader {
  string key = 1;
  string value = 2;
}

message Request {
  int64 live_id = 1;
  int64 aid = 2;
  string room_id = 3;
  string identity = 4;
  string last_rtt = 5;
  string internal_ext = 6;
  string cursor = 7;
  string device_id = 8;
  string unique_id = 9;
  string device_platform = 10;
  string app_language = 11;
  string version_code = 12;
  string update_version_code = 13;
  string resp_content_type = 14;
  string get_history = 15;
  string ac = 16;
  string keep_method = 17;
  string stress = 18;
  int64 recv_cnt = 19;
  int64 parse_cnt = 20;
  string fetch_rule = 21;
  string ab_group = 22;
  string live_cursor = 23;
  string sub_room_id = 24;
  int64 need_persist_msg_count = 25;
}

message Response {
  repeated Message messages = 1;
  string cursor = 2;
  int64 fetch_interval = 3;
  int64 now = 4;
  string internal_ext = 5;
  int32 fetch_type = 6;
  map<string,string> route_params = 7;
  int64 heartbeat_duration = 8;
  bool need_ack = 9;
  string push_server = 10;
  string live_cursor = 11;
  bool history_no_more = 12;
  string proxy_server = 13;
  string push_server_v2 = 14;
}
